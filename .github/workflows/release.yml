name: Release

# Publie une release GitHub. Trois déclencheurs :
#   - Automatique : à chaque push sur `main`, si la version de
#     `src-tauri/tauri.conf.json` n'a pas encore de release (= version bumpée),
#     le tag `v<version>` est créé et la release publiée. Sinon, on ne fait rien.
#   - Tag `v*` poussé manuellement (ex: `v0.0.1`) : release toujours.
#   - Lancement manuel (Actions → Release → Run workflow) : le tag est dérivé de
#     la version dans `tauri.conf.json` et tauri-action crée le tag.
#
# La release contient trois manières de récupérer Taffk :
#   - Installateur Windows   : `Taffk_<version>_x64-setup.exe` (NSIS)
#   - Exécutable portable    : `Taffk_<version>_x64_portable.exe` (sans installateur)
#   - Code source            : « Source code (zip / tar.gz) », ajouté par GitHub.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Décide s'il faut publier. Sur un push vers `main`, on ne release que si la
  # version de `tauri.conf.json` n'a pas encore de release (= la version vient
  # d'être bumpée). Sur un tag `v*` ou un lancement manuel, on release toujours.
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
          else
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            tag="v${version}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

          if [ "${{ github.event_name }}" != "push" ] || [ "${{ github.ref_type }}" = "tag" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag existe déjà — rien à publier."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Nouvelle version détectée — publication de $tag."
          fi

  release:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build app & publish release (installateur + code source)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signe les artefacts de mise à jour (latest.json + .sig) pour
          # l'updater intégré (Paramètres → Mises à jour). La clé est générée
          # par `npm run tauri signer generate` ; sans ce secret, le build
          # échoue car `createUpdaterArtifacts` est activé.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.check.outputs.tag }}
          releaseName: Taffk ${{ needs.check.outputs.tag }}
          releaseDraft: false
          prerelease: false
          # On ne produit que l'installateur NSIS (.exe). Le binaire portable
          # est ajouté à l'étape suivante, et GitHub joint le code source.
          args: --bundles nsis
          releaseBody: |
            ## Télécharger Taffk

            | Option | Fichier | Pour qui |
            | --- | --- | --- |
            | **Installateur** | `Taffk_*_x64-setup.exe` | Installation classique (raccourcis, désinstalleur). |
            | **Portable** | `Taffk_*_x64_portable.exe` | Aucun installateur : lancez le `.exe` directement, où vous voulez. |
            | **Code source** | *Source code* (zip / tar.gz) ci-dessous | Compiler vous-même. |

            La version installée peut se mettre à jour depuis l'application :
            **Paramètres → Mises à jour → Rechercher les mises à jour**.
            (Les fichiers `latest.json` et `*.sig` servent à cette mise à jour
            intégrée — pas besoin de les télécharger.)

      - name: Stage portable executable
        shell: pwsh
        run: |
          $version = '${{ needs.check.outputs.tag }}' -replace '^v', ''
          $dest = "Taffk_${version}_x64_portable.exe"
          Copy-Item 'src-tauri/target/release/taffk.exe' $dest
          "PORTABLE_EXE=$dest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Attach portable executable to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          files: ${{ env.PORTABLE_EXE }}
          fail_on_unmatched_files: true
